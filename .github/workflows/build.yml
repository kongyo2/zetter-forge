name: Build

# Actions タブの「Build」→「Run workflow」から手動で実行する。
# できたインストーラーは、実行結果のページの Artifacts からダウンロードできる。
on:
  workflow_dispatch:
    inputs:
      platform:
        description: ビルドする環境
        type: choice
        default: all
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 30
    # 手順は 3 つの環境で同じ（electron-builder は動いている OS 向けのものを作る）
    steps: &package
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: zetter-forge-${{ github.job }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
          # 成果物は Actions の保存容量を使うので、1 週間で消す
          retention-days: 7
          # インストーラーはもう圧縮されているので、重ねて圧縮しない
          compression-level: 0

  macos:
    name: macOS
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    timeout-minutes: 30
    steps: *package

  linux:
    name: Linux
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps: *package
