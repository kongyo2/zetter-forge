name: Release

# 各環境向けのインストーラー（Windows の exe、macOS の dmg、Linux の AppImage）を作り、
# GitHub の Release に載せて公開する。
# - Actions タブの「Release」→「Run workflow」から実行する。版を空にすると package.json の version
# - v で始まるタグ（v0.2.0 など）を push しても実行される
# 同じ版でもう一度実行すると、その Release のファイルを差し替える。
on:
  workflow_dispatch:
    inputs:
      version:
        description: リリースする版（例 0.2.0）。空なら package.json の version
        type: string
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write

# 同じ版のリリースを重ねて走らせない
concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 版を決めて Release を用意する
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: 版を決める
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版の形が正しくありません: $version（例 0.2.0）"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      # できあがるまでは下書きにしておき、全部の環境のファイルがそろってから公開する
      - name: Release を下書きで作る（もうあれば、そのまま使う）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG の Release はもうあるので、ファイルを差し替える"
            exit 0
          fi
          flags=(--draft --target "$GITHUB_SHA" --title "Zetter Forge $TAG" --generate-notes)
          # 0.2.0-beta.1 のような版は「プレリリース」にする
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            files: release/*.exe
          - name: macOS
            os: macos-latest
            files: release/*.dmg
          - name: Linux
            os: ubuntu-latest
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # インストーラーの名前とアプリの「バージョン情報」に出る版を、リリースする版に合わせる
      - name: 版を合わせる
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run package
      - name: Release にファイルを載せる
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" ${{ matrix.files }} --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Release を公開する
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 下書きを公開する
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
